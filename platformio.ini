[env:esp32-c3-super-mini]
platform = espressif32@6.10.0
board = esp32-c3-devkitm-1
framework = arduino
board_build.filesystem = littlefs
lib_deps = knolleary/PubSubClient@2.8
monitor_speed = 115200
